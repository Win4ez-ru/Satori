name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SATORI_ENVIRONMENT: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --no-editable --reinstall-package satori-core

      - name: Set isolated runtime paths
        run: |
          echo "SATORI_DATABASE_URL=sqlite+pysqlite:///${RUNNER_TEMP}/satori-ci.db" >> "$GITHUB_ENV"
          echo "SATORI_SOURCE_POLICY_DIRECTORY=${RUNNER_TEMP}/satori-source-policy" >> "$GITHUB_ENV"

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type-check
        run: uv run --no-sync mypy src tests

      - name: Test
        # Keep native audio and the Qt suite in separate Python processes.
        run: |
          uv run --no-sync pytest --ignore=tests/test_voice_engines.py
          uv run --no-sync pytest tests/test_voice_engines.py

      - name: Migrate and bootstrap an isolated database
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync satori bootstrap
